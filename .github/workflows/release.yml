name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          # Get the latest release tag sorted by semver
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${NEXT_VERSION}"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.target }})
    needs: [determine-version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cat >> ~/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package artifacts
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist

          # Package CLI binary
          if [ -f "target/${TARGET}/release/picloud" ]; then
            tar czf "dist/picloud-cli-v${VERSION}-${TARGET}.tar.gz" \
              -C "target/${TARGET}/release" picloud
          fi

          # Package server binary
          if [ -f "target/${TARGET}/release/picloud-server" ]; then
            tar czf "dist/picloud-server-v${VERSION}-${TARGET}.tar.gz" \
              -C "target/${TARGET}/release" picloud-server
          fi

          # Generate checksums
          cd dist
          sha256sum *.tar.gz > "checksums-${TARGET}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/checksums-*.txt

  release:
    name: Create Release
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -name 'checksums-*.txt' -exec cat {} \; \
            | sort > release/checksums-sha256.txt

      - name: Create git tag
        env:
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: PiCloud ${{ needs.determine-version.outputs.tag }}
          generate_release_notes: true
          files: release/*
          body: |
            ## Artifacts

            | Binary | Description |
            |--------|-------------|
            | `picloud-cli-*` | PiCloud management CLI (includes SDK generation) |
            | `picloud-server-*` | PiCloud node server binary |

            ### Targets
            - `x86_64-unknown-linux-gnu` — x86-64 Linux
            - `aarch64-unknown-linux-gnu` — ARM64 Linux (Raspberry Pi 5)

            Verify checksums with:
            ```
            sha256sum -c checksums-sha256.txt
            ```
