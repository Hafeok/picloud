[package]
name        = "picloud-cli"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
name = "picloud_cli"
path = "src/lib.rs"

[[bin]]
name = "picloud"
path = "src/main.rs"

[dependencies]
picloud-domain = { workspace = true }
picloud-compiler = { workspace = true }
picloud-sdk-gen = { workspace = true }
# CLI talks to the cluster via HTTP only — except sdk-gen which runs locally
clap    = { workspace = true }
tokio   = { workspace = true }
reqwest = { workspace = true }
serde   = { workspace = true }
serde_json = { workspace = true }
chrono  = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
uuid    = { workspace = true }
futures = { workspace = true }
base64  = { workspace = true }
ctap-hid-fido2 = { workspace = true, optional = true }
sha2    = { workspace = true }

[features]
default = []
fido2 = ["ctap-hid-fido2"]
