[package]
name = "picloud-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "picloud_test"
path = "src/lib.rs"

[[bin]]
name = "picloud-test"
path = "src/main.rs"

[dependencies]
picloud-domain = { workspace = true }
reqwest = { workspace = true }
hickory-resolver = { version = "0.25" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
url = { workspace = true }

# Dev-only: integration tests that exercise the harness helpers against an
# in-process picloud-server need the server stack (TC-353 regression).
# These dependencies are NOT part of the runtime crate — the production
# binary still only depends on picloud-domain per ADR-034.
[dev-dependencies]
picloud-events = { workspace = true }
picloud-http = { workspace = true }
picloud-rdf = { workspace = true }
axum = { workspace = true }
