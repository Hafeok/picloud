# PiCloud Test Cluster Configuration
#
# This file contains the real cluster IPs for the Pi 5 test cluster.
# For a different cluster, copy and edit:
#   cp cluster.toml cluster-local.toml
#   picloud-test run --config cluster-local.toml

[cluster]
domain = "picloud.local"
http_port = 7443
platform_version = "0.1.0"
tls = false
base_host = "192.168.88.22"   # node3 IP — avoids DNS resolution issues

[operator]
hostname = "management"
ip = "192.168.88.10"
ssh_user = "admin"

[[nodes]]
hostname = "worker01"
ip = "192.168.88.21"
role = "Worker"
ssh_user = "admin"

[[nodes]]
hostname = "worker02"
ip = "192.168.88.20"
role = "Worker"
ssh_user = "admin"

[[nodes]]
hostname = "node3"
ip = "192.168.88.22"
role = "Build"
ssh_user = "admin"
