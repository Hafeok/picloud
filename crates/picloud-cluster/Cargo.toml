[package]
name        = "picloud-cluster"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
picloud-domain = { workspace = true }
tokio          = { workspace = true }
async-trait    = { workspace = true }
tracing        = { workspace = true }
thiserror      = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
chrono         = { workspace = true }
openraft = { workspace = true }
reqwest  = { workspace = true }
axum     = { workspace = true }
mdns-sd  = { workspace = true }
uuid     = { workspace = true }
sled     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
sled = { workspace = true }
serde_json = { workspace = true }
# TC-355 regression test spins up in-process `picloud-server` instances,
# which needs the HTTP server to observe `GET /` responses. Keeping this
# confined to dev-dependencies preserves the slice-independence rule.
picloud-http = { workspace = true }
reqwest = { workspace = true }
